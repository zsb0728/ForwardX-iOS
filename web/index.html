  <head>
    <meta charset="UTF-8" />

      content="width=device-width, initial-scale=1.0, maximum-scale=1" />
    <title>ForwardX</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <script>
      (function () {
        try {
          var theme = window.localStorage.getItem("forwardx-theme") || "light";
          var resolved = theme === "system"
            ? (window.matchMedia("(prefers-color-scheme: dark)").matches ? "dark" : "light")
            : theme;
          document.documentElement.classList.remove("light", "dark");
          document.documentElement.classList.add(resolved === "dark" ? "dark" : "light");
        } catch (error) {
          document.documentElement.classList.add("light");
        }
      })();
    </script>
    <script>
      /* iOS distribution default; users can still change it in ForwardX settings. */
      try {
        if (!localStorage.getItem("forwardx.mobile.panelUrl")) {
          localStorage.setItem("forwardx.mobile.panelUrl", "https://vps.na21.icu");
        }
      } catch (_) {}
    </script>
