name: ForwardX
options:
  bundleIdPrefix: com.forwardx
  deploymentTarget:
    iOS: "17.0"
targets:
  ForwardX:
    type: application
    platform: iOS
    sources: [ForwardX]
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.forwardx.app
        PRODUCT_NAME: ForwardX
        SWIFT_VERSION: 6.0
        TARGETED_DEVICE_FAMILY: "1,2"
        CODE_SIGN_STYLE: Manual
        CODE_SIGNING_ALLOWED: NO
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: ForwardX
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.utilities
        INFOPLIST_KEY_NSFaceIDUsageDescription: 用于保护 ForwardX 登录状态
        INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: YES
        INFOPLIST_KEY_UILaunchScreen_Generation: YES
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
